<!DOCTYPE html>
<html>
<head>
    <title>Online Bus Pass System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .header {
            background: #4b0082;
            color: white;
            padding: 25px;
        }

        .container {
            background: white;
            width: 70%;
            margin: 60px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin: 0;
        }

        h2 {
            color: #4b0082;
            margin-top: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 15px 8px;
            background: #4b0082;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn:hover {
            background: #6a0dad;
        }

        .footer {
            margin-top: 50px;
            padding: 15px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🚌 Online Bus Pass System</h1>
        <p style="color:white;">Easy • Fast • Online</p>
    </div>

    <div class="container">

        <h2>Welcome!</h2>

        <p>
            Apply for your bus pass online easily.
        </p>

        <p>
            Register your account and manage your bus pass from anywhere.
        </p>

        <a href="/register" class="btn">Register</a>

        <a href="/login" class="btn">Login</a>

    </div>

    <div class="footer">
        <p style="color:white;">
            © 2026 Online Bus Pass System
        </p>
    </div>

</body>
</html>
