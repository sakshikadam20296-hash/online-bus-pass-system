<!DOCTYPE html>
<html>
<head>
    <title>Apply for Bus Pass</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #4b0082;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .form-container {
            width: 90%;
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #4b0082;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #4b0082;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #6a0dad;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4b0082;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🚌 Online Bus Pass System</h1>
    </div>

    <div class="form-container">

        <h2>Apply for Bus Pass</h2>

        <form method="POST" action="/apply-pass">

            <label>Student Name</label>
            <input type="text" name="student_name" required>

            <label>College Name</label>
            <input type="text" name="college" required>

            <label>Source</label>
            <input type="text" name="source" placeholder="Example: Karad" required>

            <label>Destination</label>
            <input type="text" name="destination" placeholder="Example: Satara" required>

            <label>Pass Type</label>
            <select name="pass_type" required>
                <option value="">Select Pass Type</option>
                <option value="Monthly">Monthly</option>
                <option value="Quarterly">Quarterly</option>
                <option value="Yearly">Yearly</option>
            </select>

            <label>Start Date</label>
            <input type="date" name="start_date" required>

            <button type="submit" class="submit-btn">
                Apply for Pass
            </button>

        </form>

        <a href="/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
