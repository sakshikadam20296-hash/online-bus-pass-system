<!DOCTYPE html>
<html>
<head>
    <title>Application Submitted</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .header {
            background: #4b0082;
            color: white;
            padding: 25px;
        }

        .box {
            width: 80%;
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .success {
            font-size: 55px;
        }

        h2 {
            color: #4b0082;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            background: #4b0082;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #6a0dad;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🚌 Online Bus Pass System</h1>
    </div>

    <div class="box">

        <div class="success">✅</div>

        <h2>Application Submitted Successfully!</h2>

        <p>Your bus pass application has been submitted.</p>

        <a href="/my-pass" class="btn">
            🎫 View My Bus Pass
        </a>

        <a href="/dashboard" class="btn">
            ← Dashboard
        </a>

    </div>

</body>
</html>
