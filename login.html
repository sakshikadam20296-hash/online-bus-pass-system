<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
</head>

<body>

    <h1>Student Login</h1>

    <form method="POST" action="/login">

        Email:
        <input type="email" name="email" required>
        <br><br>

        Password:
        <input type="password" name="password" required>
        <br><br>

        <input type="submit" value="Login">

    </form>

    <br>

    <a href="/register">
        <button>New User? Register</button>
    </a>

</body>
</html>
