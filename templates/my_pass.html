<!DOCTYPE html>
<html>
<head>
    <title>My Bus Pass</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
        }

        .header {
            background: #4b0082;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .pass-container {
            width: 90%;
            max-width: 550px;
            margin: 50px auto;
        }

        .pass-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.18);
        }

        .pass-title {
            background: #4b0082;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .pass-body {
            padding: 30px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 14px 0;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
        }

        .route {
            text-align: center;
            margin: 25px 0;
            font-size: 18px;
            font-weight: bold;
            color: #4b0082;
        }

        .pass-type {
            text-align: center;
            background: #f0e6ff;
            color: #4b0082;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }

        .button {
            display: block;
            width: 220px;
            margin: 15px auto 0;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .delete-btn {
            background: #dc3545;
        }

        .clear-btn {
            background: #6c2bd9;
        }

        .back-btn {
            display: block;
            width: 200px;
            margin: 25px auto;
            padding: 13px;
            background: #4b0082;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
        }

        .no-pass {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</
